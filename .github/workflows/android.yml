name: Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
            packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Check signing secrets
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore release keystore
        if: ${{ steps.signing.outputs.has_signing == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build debug APK
        if: ${{ steps.signing.outputs.has_signing != 'true' }}
        run: ./gradlew clean :app:assembleDebug :app:lintDebug --no-daemon

      - name: Build signed release APK
        if: ${{ steps.signing.outputs.has_signing == 'true' }}
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew clean :app:assembleRelease :app:lintRelease --no-daemon

      - name: Prepare APK artifact
        env:
          HAS_SIGNING: ${{ steps.signing.outputs.has_signing }}
        run: |
          mkdir -p dist
          if [ "$HAS_SIGNING" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/embeng-q-release.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk dist/embeng-q-debug.apk
          fi
          apkanalyzer="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/apkanalyzer' -type f | head -n 1)"
          if [ -z "$apkanalyzer" ]; then
            echo "Android SDK apkanalyzer was not found" >&2
            exit 1
          fi
          for apk in dist/*.apk; do
            actual_package="$("$apkanalyzer" manifest application-id "$apk")"
            if [ "$actual_package" != "com.embeng.q" ]; then
              echo "Unexpected APK package: $actual_package (expected com.embeng.q)" >&2
              exit 1
            fi
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify "$apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: embeng-q-apk
          path: dist/*

      - name: Upload APK to versioned GitHub Release
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version_name="$(sed -n "s/^[[:space:]]*versionName[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" app/build.gradle | head -n 1)"
          if [ -z "$version_name" ]; then
            echo "Could not read versionName from app/build.gradle" >&2
            exit 1
          fi

          tag="v$version_name"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git tag -f "$tag" "$GITHUB_SHA"
            git push -f origin "refs/tags/$tag"
          fi

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "Embeng-Q $tag" \
              --notes "Automated APK build for $tag."
          else
            gh release edit "$tag" --target "$GITHUB_SHA"
          fi

          for apk in dist/*.apk; do
            base="$(basename "$apk" .apk)"
            cp "$apk" "dist/${base}-${tag}.apk"
          done
          (cd dist && sha256sum *-${tag}.apk > "SHA256SUMS-${tag}.txt")

          gh release upload "$tag" dist/*-${tag}.apk "dist/SHA256SUMS-${tag}.txt" --clobber
