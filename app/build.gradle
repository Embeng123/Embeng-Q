apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def releaseSigning = [
    'ANDROID_KEYSTORE_FILE',
    'ANDROID_KEYSTORE_PASSWORD',
    'ANDROID_KEY_ALIAS',
    'ANDROID_KEY_PASSWORD'
].collectEntries { name -> [(name): System.getenv(name)] }
def hasReleaseSigning = releaseSigning.values().every { it != null && !it.isEmpty() }
if (!hasReleaseSigning && releaseSigning.values().any { it != null && !it.isEmpty() }) {
    throw new GradleException('Release signing requires ANDROID_KEYSTORE_FILE, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD.')
}

android {
    namespace 'com.embeng.q'
    compileSdk 34

    defaultConfig {
        applicationId 'com.embeng.q'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.0.2'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseSigning['ANDROID_KEYSTORE_FILE'])
                storePassword releaseSigning['ANDROID_KEYSTORE_PASSWORD']
                keyAlias releaseSigning['ANDROID_KEY_ALIAS']
                keyPassword releaseSigning['ANDROID_KEY_PASSWORD']
            }
        }
    }

    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled false
            shrinkResources false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    sourceSets { main.java.srcDirs += 'src/main/kotlin' }
}

dependencies {
    implementation files('libs/usque-classes.jar')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
